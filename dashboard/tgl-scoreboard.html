<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TGL Scorebord — Heym Lounge</title>
    <link rel="stylesheet" href="../shared/styles.css" />
  </head>
  <body>
    <header class="dash">
      <a href="../index.html"><img src="../assets/heym-logo.png" alt="Heym" /></a>
      <div class="who">
        <a href="./index.html">Naar dashboard</a>
        <span id="who-email"></span>
        <button class="small" id="sign-out">Uitloggen</button>
      </div>
    </header>

    <main class="dash-wrap">
      <p id="loading-note">Laden...</p>

      <div id="access-denied" class="card" hidden>
        <p>Dit account heeft geen organisatorrechten.</p>
        <a href="../member/index.html">Naar mijn events</a>
      </div>

      <div id="scoreboard-content" hidden>
        <section class="dash-section">
          <h2>TGL Scorebord</h2>
          <div id="events-scoreboard"></div>
        </section>
      </div>
    </main>

    <div id="footer-mount"></div>

    <script src="../shared/vendor/supabase-js.js"></script>
    <script src="../shared/config.js"></script>
    <script src="../shared/supabase-client.js"></script>
    <script src="../shared/footer.js"></script>
    <script>
      const PUBLISHABLE_KEY = SUPABASE_PUBLISHABLE_KEY;

      mountFooter("../");

      // Same fresh-session-per-call pattern as the rest of the dashboard
      // (see dashboard/index.html's own call() for why).
      async function call(name, { method = "GET", body, query } = {}) {
        const {
          data: { session },
        } = await supabaseClient.auth.getSession();
        if (!session) {
          window.location.href = "../login/index.html";
          throw new Error("Session expired");
        }
        let url = `${FUNCTIONS_URL}/${name}`;
        if (query) url += "?" + new URLSearchParams(query).toString();
        const res = await fetch(url, {
          method,
          headers: {
            apikey: PUBLISHABLE_KEY,
            Authorization: `Bearer ${session.access_token}`,
            "Content-Type": "application/json",
          },
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const error = new Error(data.error || `${name} failed (${res.status})`);
          error.status = res.status;
          throw error;
        }
        return data;
      }

      function esc(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function fmtDate(iso) {
        return new Date(iso).toLocaleString("nl-NL", {
          weekday: "short",
          day: "numeric",
          month: "short",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      // Read-only by default, matching the member-facing view -- "Bewerken"
      // (next to the event heading) swaps a roster into an editable form
      // with its own "Opslaan", same Bewerken/Wijzigingen-opslaan pattern
      // already used for editing events elsewhere on the dashboard.
      const rosterByEvent = new Map();

      function renderReadOnly(container, roster) {
        if (roster.length === 0) {
          container.innerHTML = '<p class="empty-note">Nog geen deelnemers die komen.</p>';
          return;
        }
        container.innerHTML = `
          <div class="player-row player-row-header">
            <span>Speler</span>
            <span>Holes</span>
            <span>Totaal slagen</span>
            <span>Handicap</span>
            <span></span>
          </div>
          ${roster
            .map(
              (p) => `
            <div class="player-row">
              <strong>${esc(p.name)}</strong>
              <span>${p.holes_played ?? "-"}</span>
              <span>${p.total_shots ?? "-"}</span>
              <span>${p.handicap ?? "-"}</span>
              <span></span>
            </div>`,
            )
            .join("")}
        `;
      }

      function renderEditable(container, eventId, roster) {
        if (roster.length === 0) {
          container.innerHTML = '<p class="empty-note">Nog geen deelnemers die komen.</p>';
          return;
        }
        container.innerHTML = `
          <div class="player-row player-row-header">
            <span>Speler</span>
            <span>Holes</span>
            <span>Totaal slagen</span>
            <span>Handicap</span>
            <span></span>
          </div>
          ${roster
            .map(
              (p) => `
            <div class="player-row" data-member="${esc(p.member_id)}">
              <strong>${esc(p.name)}</strong>
              <input type="number" min="0" class="gs-holes" value="${p.holes_played ?? ""}" />
              <input type="number" class="gs-shots" value="${p.total_shots ?? ""}" />
              <input type="number" step="0.1" class="gs-handicap" value="${p.handicap ?? ""}" />
              <span></span>
            </div>`,
            )
            .join("")}
          <div style="display: flex; align-items: center; gap: 0.75rem; margin-top: 0.5rem">
            <button type="button" class="primary gs-save">Opslaan</button>
            <p class="status gs-status" style="margin: 0"></p>
          </div>
        `;

        container.querySelector(".gs-save").addEventListener("click", async () => {
          const status = container.querySelector(".gs-status");
          status.textContent = "Opslaan...";
          status.className = "status";
          const num = (el) => (el.value === "" ? null : Number(el.value));
          try {
            await Promise.all(
              [...container.querySelectorAll(".player-row[data-member]")].map((row) =>
                call("save-golf-score", {
                  method: "POST",
                  body: {
                    event_id: eventId,
                    member_id: row.dataset.member,
                    holes_played: num(row.querySelector(".gs-holes")),
                    total_shots: num(row.querySelector(".gs-shots")),
                    handicap: num(row.querySelector(".gs-handicap")),
                    played_on: null,
                  },
                }),
              ),
            );
            const fresh = await call("get-event-scoreboard", { query: { event_id: eventId } });
            rosterByEvent.set(eventId, fresh);
            renderEditable(container, eventId, fresh);
            container.querySelector(".gs-status").textContent = "Opgeslagen.";
            container.querySelector(".gs-status").className = "status ok";
          } catch (err) {
            status.textContent = err.message;
            status.className = "status error";
          }
        });
      }

      async function loadAll() {
        const events = await call("list-events");
        const golfEvents = events
          .filter((e) => e.type === "golf")
          // Newest evening first -- this is meant to answer "what's the
          // latest update" at a glance, not double as an upcoming-events
          // calendar (that's what the events list on the dashboard is for).
          .sort((a, b) => new Date(b.starts_at).getTime() - new Date(a.starts_at).getTime());

        const el = document.getElementById("events-scoreboard");
        if (golfEvents.length === 0) {
          el.innerHTML = '<p class="empty-note">Nog geen golfevents.</p>';
          return;
        }

        el.innerHTML = golfEvents
          .map(
            (ev, i) => `
          ${i > 0 ? '<hr class="section-divider" />' : ""}
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap">
            <h3 style="margin: 0">${esc(ev.name)} <span class="meta">— ${fmtDate(ev.starts_at)}</span></h3>
            <button type="button" class="small" data-action="edit-toggle" data-event="${esc(ev.id)}">Bewerken</button>
          </div>
          <div class="roster" data-event="${esc(ev.id)}"></div>
        `,
          )
          .join("");

        for (const ev of golfEvents) {
          const container = el.querySelector(`.roster[data-event="${ev.id}"]`);
          try {
            const roster = await call("get-event-scoreboard", { query: { event_id: ev.id } });
            rosterByEvent.set(ev.id, roster);
            renderReadOnly(container, roster);
          } catch (err) {
            container.innerHTML = `<p class="status error">${esc(err.message)}</p>`;
          }
        }

        el.querySelectorAll('[data-action="edit-toggle"]').forEach((btn) => {
          btn.addEventListener("click", () => {
            const eventId = btn.dataset.event;
            const container = el.querySelector(`.roster[data-event="${eventId}"]`);
            const roster = rosterByEvent.get(eventId) ?? [];
            if (btn.textContent === "Bewerken") {
              renderEditable(container, eventId, roster);
              btn.textContent = "Verbergen";
            } else {
              renderReadOnly(container, roster);
              btn.textContent = "Bewerken";
            }
          });
        });
      }

      document.getElementById("sign-out").addEventListener("click", async () => {
        await supabaseClient.auth.signOut();
        window.location.href = "../login/index.html";
      });

      (async () => {
        const { data } = await supabaseClient.auth.getSession();
        if (!data.session) {
          window.location.href = "../login/index.html";
        } else {
          document.getElementById("who-email").textContent = data.session.user.email;
          try {
            await loadAll();
            document.getElementById("loading-note").hidden = true;
            document.getElementById("scoreboard-content").hidden = false;
          } catch (e) {
            if (e.status === 403) {
              document.getElementById("loading-note").hidden = true;
              document.getElementById("access-denied").hidden = false;
            } else {
              const note = document.getElementById("loading-note");
              note.textContent = `Er ging iets mis: ${e.message}. Ververs de pagina om het opnieuw te proberen.`;
              note.className = "status error";
            }
          }
        }
      })();
    </script>
  </body>
</html>
