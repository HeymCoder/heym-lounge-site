<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Heym Lounge</title>
    <link rel="stylesheet" href="../shared/styles.css" />
  </head>
  <body>
    <header class="dash">
      <a href="../index.html"><img src="../assets/heym-logo.png" alt="Heym" /></a>
      <div class="who">
        <a href="../member/index.html">Naar mijn events</a>
        <span id="who-email"></span>
        <button class="small" id="sign-out">Uitloggen</button>
      </div>
    </header>

    <main class="dash-wrap">
      <p id="loading-note">Laden...</p>

      <div id="access-denied" class="card" hidden>
        <p>Dit account heeft geen organisatorrechten.</p>
        <a href="../member/index.html">Naar mijn events</a>
      </div>

      <div id="dashboard-content" hidden>
        <section class="dash-section">
          <h2>Aanmeldingen</h2>
          <div id="submissions-list"></div>
        </section>

        <section class="dash-section">
          <h2>Relaties</h2>
          <div id="members-list"></div>
        </section>

        <section class="dash-section">
          <h2>Events</h2>
          <div id="events-list"></div>

          <h3>Nieuw event</h3>
          <form id="create-event-form" class="card">
            <label for="ev-name">Naam</label>
            <input id="ev-name" required />

            <label for="ev-type">Type</label>
            <select id="ev-type">
              <option value="social">Sociaal (borrel/get-together)</option>
              <option value="golf">Golf (TGL)</option>
            </select>

            <label for="ev-starts">Datum en tijd</label>
            <input id="ev-starts" type="datetime-local" required />

            <label for="ev-location">Locatie</label>
            <input id="ev-location" required value="Heym Lounge" />

            <label for="ev-capacity">Capaciteit (optioneel)</label>
            <input id="ev-capacity" type="number" min="1" />

            <label for="ev-series">Seizoen/reeks (optioneel, bv. "TGL 2026-2027")</label>
            <input id="ev-series" />

            <label>Uitnodigen</label>
            <div id="invite-members" class="checkbox-grid"></div>

            <button class="primary" type="submit">Event aanmaken</button>
            <p id="create-event-status" class="status"></p>
          </form>
        </section>

      </div>
    </main>

    <div id="footer-mount"></div>

    <script src="../shared/vendor/supabase-js.js"></script>
    <script src="../shared/config.js"></script>
    <script src="../shared/supabase-client.js"></script>
    <script src="../shared/footer.js"></script>
    <script>
      const PUBLISHABLE_KEY = SUPABASE_PUBLISHABLE_KEY;

      mountFooter("../");

      let members = [];

      // Reads the current session fresh on every call instead of a token
      // captured once at boot -- supabase-js refreshes the underlying
      // session in the background (jwt_expiry is 3600s), but a token cached
      // in a plain variable at boot never sees that refresh.
      async function call(name, { method = "GET", body, query } = {}) {
        const {
          data: { session },
        } = await supabaseClient.auth.getSession();
        if (!session) {
          window.location.href = "../login/index.html";
          throw new Error("Session expired");
        }
        let url = `${FUNCTIONS_URL}/${name}`;
        if (query) url += "?" + new URLSearchParams(query).toString();
        const res = await fetch(url, {
          method,
          headers: {
            apikey: PUBLISHABLE_KEY,
            Authorization: `Bearer ${session.access_token}`,
            "Content-Type": "application/json",
          },
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const error = new Error(data.error || `${name} failed (${res.status})`);
          error.status = res.status;
          throw error;
        }
        return data;
      }

      // Everything rendered below comes from the database, and interest
      // submissions are written by an unauthenticated public endpoint -- so any
      // server value put into innerHTML is attacker-controlled until it goes
      // through esc(). Member names inherit the same taint via approval.
      function esc(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function fmtDate(iso) {
        return new Date(iso).toLocaleString("nl-NL", {
          weekday: "short",
          day: "numeric",
          month: "short",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      // Matches the labels members see on their own "Mijn events" page --
      // same status, same words, whether it's them or the organiser
      // looking at it.
      const RSVP_STATUS_LABELS = { pending: "nog niet gereageerd", yes: "komt", no: "afgemeld" };

      function renderSubmissions(subs) {
        const el = document.getElementById("submissions-list");
        if (subs.length === 0) {
          el.innerHTML = '<p class="empty-note">Geen openstaande aanmeldingen.</p>';
          return;
        }
        el.innerHTML = "";
        for (const s of subs) {
          const row = document.createElement("div");
          row.className = "list-item";
          row.innerHTML = `
            <div>
              <strong>${esc(s.name)}</strong> ${s.partner_or_company ? `— ${esc(s.partner_or_company)}` : ""}
              <div class="meta">${esc(s.email)} · ${fmtDate(s.submitted_at)}${s.referred_by ? ` · doorverwezen door ${esc(s.referred_by)}` : ""}</div>
            </div>
            <div class="actions">
              <button class="small" data-action="approved">Goedkeuren</button>
              <button class="small danger" data-action="rejected">Afwijzen</button>
            </div>
          `;
          row.querySelectorAll("button").forEach((btn) => {
            btn.addEventListener("click", async () => {
              btn.disabled = true;
              try {
                const result = await call("review-interest", {
                  method: "POST",
                  body: { submission_id: s.id, decision: btn.dataset.action },
                });
                if (result.invite_error) {
                  alert(
                    `Goedgekeurd, maar de uitnodiging kon niet worden verstuurd: ${result.invite_error}\n\nHet lid is wel aangemaakt -- de uitnodiging moet opnieuw geprobeerd worden.`,
                  );
                }
                await loadAll();
              } catch (e) {
                alert(e.message);
                btn.disabled = false;
              }
            });
          });
          el.appendChild(row);
        }
      }

      function renderEvents(events) {
        const el = document.getElementById("events-list");
        if (events.length === 0) {
          el.innerHTML = '<p class="empty-note">Nog geen events.</p>';
        } else {
          el.innerHTML = "";
          // TGL/golf events first -- the primary use of this list -- then
          // social. Array#sort is stable, so each group keeps the
          // starts_at-ascending order list-events already returns.
          const sorted = [...events].sort((a, b) => (a.type === b.type ? 0 : a.type === "golf" ? -1 : 1));
          for (const ev of sorted) {
            el.appendChild(buildEventRow(ev));
          }
        }
      }

      // datetime-local inputs want local wall-clock time with no timezone --
      // same round-trip the create-event form already does the other way
      // (new Date(value).toISOString() on submit).
      function toDatetimeLocalValue(iso) {
        const d = new Date(iso);
        const pad = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      // One row = the summary line (unchanged) plus a collapsed edit panel:
      // editable fields, the current invite list with a remove button per
      // person, and a picker for anyone not yet invited. Removals are only
      // tracked locally (the `removed` set) until "Wijzigingen opslaan" is
      // clicked -- one update-event call per save, matching how that
      // endpoint is designed (field edits + invite changes, together).
      function buildEventRow(ev, { startOpen = false } = {}) {
        const row = document.createElement("div");
        row.className = "list-item";
        row.style.flexDirection = "column";
        row.style.alignItems = "stretch";

        // Golf's capacity is hard-blocked at the database level (see the
        // enforce_golf_capacity trigger) -- reaching it there is just the
        // normal full-booked state, nothing to flag. Social/indoor events
        // are deliberately never blocked (organisers said a couple over
        // is fine), so going at-or-over capacity there is exactly the
        // moment that needs the organiser's attention.
        const capacityLabel =
          ev.capacity == null
            ? ""
            : ` · ${ev.confirmed_count}/${ev.capacity}` +
              (ev.type !== "golf" && ev.confirmed_count >= ev.capacity ? " ⚠️ bijna vol" : "");

        const invitedIds = new Set(ev.participants.map((p) => p.member_id));
        const declined = new Set();

        row.innerHTML = `
          <div style="display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap">
            <div>
              <strong>${esc(ev.name)}</strong> <span class="meta">(${ev.type === "golf" ? "golf" : "sociaal"})</span>
              <div class="meta">${
                ev.type === "golf"
                  ? fmtDate(ev.starts_at)
                  : `${fmtDate(ev.starts_at)} · ${esc(ev.location)}${ev.series ? ` · ${esc(ev.series)}` : ""}${capacityLabel}`
              }</div>
            </div>
            <div class="actions">
              <button type="button" class="small" data-action="edit">Bewerken</button>
              ${ev.type === "golf" ? '<a class="small" target="_blank" href="./tgl-scoreboard.html">Scorebord</a>' : ""}
            </div>
          </div>
          <div class="event-edit" ${startOpen ? "" : "hidden"}>
            <form class="card">
              <label>Naam</label>
              <input class="ee-name" value="${esc(ev.name)}" required />

              <label>Datum en tijd</label>
              <input class="ee-starts" type="datetime-local" value="${toDatetimeLocalValue(ev.starts_at)}" required />

              <label>Locatie</label>
              <input class="ee-location" value="${esc(ev.location)}" required />

              <label>Capaciteit (optioneel)</label>
              <input class="ee-capacity" type="number" min="1" value="${ev.capacity ?? ""}" />

              <label>Seizoen/reeks (optioneel)</label>
              <input class="ee-series" value="${esc(ev.series ?? "")}" />

              <label>Huidige deelnemers</label>
              <div class="ee-participants"></div>

              <label>Deelnemer toevoegen</label>
              <div class="checkbox-grid ee-add-members"></div>

              <div style="display: flex; gap: 0.5rem; align-items: center">
                <button class="primary" type="submit" style="flex: 1">Wijzigingen opslaan</button>
                <button type="button" class="small" data-action="close">Sluiten</button>
                <button type="button" class="small danger" data-action="delete">Verwijderen</button>
              </div>
              <p class="status ee-status"></p>
            </form>
          </div>
        `;

        const editPanel = row.querySelector(".event-edit");
        const editButton = row.querySelector('[data-action="edit"]');
        const closeButton = row.querySelector('[data-action="close"]');
        const deleteButton = row.querySelector('[data-action="delete"]');
        const participantsEl = row.querySelector(".ee-participants");
        const addMembersEl = row.querySelector(".ee-add-members");

        editButton.textContent = startOpen ? "Verbergen" : "Bewerken";

        // "Afmelden" declines on the member's behalf (rsvp_status -> 'no')
        // instead of un-inviting them -- for when someone can't use the
        // portal themselves (e.g. they're sick) and the organiser handles
        // it. Toggle, not a one-way action, so a misclick before saving is
        // easy to undo.
        //
        // Once someone is actually declined (persisted, not just a local
        // toggle), they move out of this list entirely and into "Deelnemer
        // toevoegen" below, marked "eerder afgemeld" -- they're no longer a
        // current participant, but re-addable, same as someone never
        // invited (see update_event's on-conflict-do-update for the reset
        // to 'pending' that makes re-adding actually work).
        function renderParticipants() {
          const active = ev.participants.filter((p) => p.rsvp_status !== "no");
          if (active.length === 0) {
            participantsEl.innerHTML = '<p class="empty-note">Geen deelnemers.</p>';
            return;
          }
          participantsEl.innerHTML = active
            .map((p) => {
              const isDeclining = declined.has(p.member_id);
              const effectiveStatus = isDeclining ? "no" : p.rsvp_status;
              return `
                <div class="list-item">
                  <div>${esc(p.name)} <span class="meta">(${esc(RSVP_STATUS_LABELS[effectiveStatus] ?? effectiveStatus)}${isDeclining ? " — wordt afgemeld" : ""})</span></div>
                  <button type="button" class="small${isDeclining ? "" : " danger"}" data-decline="${esc(p.member_id)}">
                    ${isDeclining ? "Ongedaan maken" : "Afmelden"}
                  </button>
                </div>`;
            })
            .join("");

          participantsEl.querySelectorAll("[data-decline]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const id = btn.dataset.decline;
              if (declined.has(id)) declined.delete(id);
              else declined.add(id);
              renderParticipants();
            });
          });
        }

        // Addable = never invited at all, or invited before and declined.
        // Both end up checkable in the same grid (checking either just adds
        // their id to add_member_ids on save) -- declined ones get a grey
        // underlay and a note so the organiser can see at a glance that
        // this person said no once already, without that stopping them
        // from picking them again. Computed once (not re-run on removal)
        // -- keeping it static avoids wiping out checkboxes the organiser
        // already ticked here if they also remove someone else in the same
        // edit session.
        const notYetInvited = members.filter((m) => !invitedIds.has(m.id)).map((m) => ({ ...m, previouslyDeclined: false }));
        const declinedMembers = ev.participants
          .filter((p) => p.rsvp_status === "no")
          .map((p) => ({ id: p.member_id, name: p.name, previouslyDeclined: true }));
        const addable = [...notYetInvited, ...declinedMembers];
        addMembersEl.innerHTML = addable.length
          ? addable
              .map(
                (m) => `
                <label${m.previouslyDeclined ? ' class="previously-declined"' : ""}>
                  <input type="checkbox" value="${esc(m.id)}" /> ${esc(m.name)}${m.previouslyDeclined ? ' <span class="meta">(eerder afgemeld)</span>' : ""}
                </label>`,
              )
              .join("")
          : '<p class="empty-note">Iedereen is al uitgenodigd.</p>';

        renderParticipants();

        function closePanel() {
          editPanel.hidden = true;
          editButton.textContent = "Bewerken";
        }

        editButton.addEventListener("click", () => {
          editPanel.hidden = !editPanel.hidden;
          editButton.textContent = editPanel.hidden ? "Bewerken" : "Verbergen";
        });

        closeButton.addEventListener("click", closePanel);

        // A confirm dialog, not a one-click button -- deleting cascades to
        // every RSVP, golf team and score attached to this event (see
        // delete_event's on-delete-cascade FKs) and can't be undone, unlike
        // "Afmelden" which stays reversible until saved.
        deleteButton.addEventListener("click", async () => {
          if (!confirm(`Weet je zeker dat je "${ev.name}" wilt verwijderen? Dit kan niet ongedaan worden gemaakt.`)) {
            return;
          }
          deleteButton.disabled = true;
          try {
            await call("delete-event", { method: "POST", body: { event_id: ev.id } });
            await loadAll();
          } catch (err) {
            alert(err.message);
            deleteButton.disabled = false;
          }
        });

        row.querySelector("form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const status = row.querySelector(".ee-status");
          status.textContent = "Bezig...";
          status.className = "status";
          const add_member_ids = [...addMembersEl.querySelectorAll("input:checked")].map((i) => i.value);
          try {
            await call("update-event", {
              method: "POST",
              body: {
                event_id: ev.id,
                name: row.querySelector(".ee-name").value,
                starts_at: new Date(row.querySelector(".ee-starts").value).toISOString(),
                location: row.querySelector(".ee-location").value,
                capacity: row.querySelector(".ee-capacity").value
                  ? Number(row.querySelector(".ee-capacity").value)
                  : null,
                series: row.querySelector(".ee-series").value || null,
                add_member_ids,
                decline_member_ids: [...declined],
              },
            });
            // Refresh this row in place with the saved result instead of a
            // full loadAll() -- that rebuilds every row collapsed, which
            // would close this panel right when the organiser wants to see
            // the save actually took effect. Other rows don't need
            // refreshing since nothing about them changed.
            const events = await call("list-events");
            const updated = events.find((e2) => e2.id === ev.id);
            const newRow = buildEventRow(updated, { startOpen: true });
            row.replaceWith(newRow);
            const newStatus = newRow.querySelector(".ee-status");
            newStatus.textContent = "Opgeslagen.";
            newStatus.className = "status ok";
          } catch (err) {
            status.textContent = err.message;
            status.className = "status error";
          }
        });

        return row;
      }

      function renderMembers(mem) {
        const el = document.getElementById("members-list");
        if (mem.length === 0) {
          el.innerHTML = '<p class="empty-note">Nog geen relaties.</p>';
          return;
        }
        el.innerHTML = mem
          .map(
            (m) => `
            <div class="list-item">
              <div>
                <strong>${esc(m.name)}</strong>${m.is_organiser ? " (organisator)" : ""}
                <div class="meta">${esc(m.email)}</div>
              </div>
            </div>
          `,
          )
          .join("");
      }

      function renderMemberCheckboxes() {
        const el = document.getElementById("invite-members");
        el.innerHTML = members
          .map(
            (m) => `
            <label>
              <input type="checkbox" value="${esc(m.id)}" />
              ${esc(m.name)}${m.is_organiser ? " (organisator)" : ""}
            </label>
          `,
          )
          .join("");
      }

      async function loadAll() {
        const [subs, mem, events] = await Promise.all([
          call("list-interest-submissions"),
          call("list-members"),
          call("list-events"),
        ]);
        members = mem;
        renderSubmissions(subs);
        renderMembers(mem);
        renderMemberCheckboxes();
        renderEvents(events);
      }

      // Golf's real cap is 8 (see rules.md) -- prefill it as a convenience
      // when switching to golf, but only if the organiser hasn't already
      // typed something, and never overwrite a value they've set.
      document.getElementById("ev-type").addEventListener("change", (e) => {
        const capacityInput = document.getElementById("ev-capacity");
        if (e.target.value === "golf" && !capacityInput.value) {
          capacityInput.value = "8";
        }
      });

      document.getElementById("create-event-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const status = document.getElementById("create-event-status");
        status.textContent = "Bezig...";
        status.className = "status";
        const invite_member_ids = [...document.querySelectorAll("#invite-members input:checked")].map(
          (i) => i.value,
        );
        try {
          await call("create-event", {
            method: "POST",
            body: {
              type: document.getElementById("ev-type").value,
              name: document.getElementById("ev-name").value,
              starts_at: new Date(document.getElementById("ev-starts").value).toISOString(),
              location: document.getElementById("ev-location").value,
              capacity: document.getElementById("ev-capacity").value
                ? Number(document.getElementById("ev-capacity").value)
                : null,
              series: document.getElementById("ev-series").value || null,
              invite_member_ids,
            },
          });
          e.target.reset();
          document.getElementById("ev-location").value = "Heym Lounge";
          status.textContent = "Event aangemaakt.";
          status.className = "status ok";
          await loadAll();
        } catch (err) {
          status.textContent = err.message;
          status.className = "status error";
        }
      });

      document.getElementById("sign-out").addEventListener("click", async () => {
        await supabaseClient.auth.signOut();
        window.location.href = "../login/index.html";
      });

      // Boot. Top-level await only works in ES modules -- this is now a
      // plain classic script (see config.js for why), so this needs an
      // async wrapper instead.
      (async () => {
        const { data } = await supabaseClient.auth.getSession();
        if (!data.session) {
          window.location.href = "../login/index.html";
        } else {
          document.getElementById("who-email").textContent = data.session.user.email;
          try {
            await loadAll();
            document.getElementById("loading-note").hidden = true;
            document.getElementById("dashboard-content").hidden = false;
          } catch (e) {
            // Only a real 403 means "not an organiser" -- anything else (a
            // network failure, a 500, ...) used to show the same "geen
            // organisatorrechten" message, which sent people down the wrong
            // troubleshooting path for an unrelated problem.
            if (e.status === 403) {
              document.getElementById("loading-note").hidden = true;
              document.getElementById("access-denied").hidden = false;
            } else {
              const note = document.getElementById("loading-note");
              note.textContent = `Er ging iets mis: ${e.message}. Ververs de pagina om het opnieuw te proberen.`;
              note.className = "status error";
            }
          }
        }
      })();
    </script>
  </body>
</html>
