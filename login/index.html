<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inloggen — Heym Lounge</title>
    <link rel="stylesheet" href="../shared/styles.css" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-card">
        <a href="../index.html" class="wordmark" style="text-decoration: none">
          Heym Lounge
        </a>

        <div id="invite-form" class="card" hidden>
          <p>Welkom! Stel hieronder je wachtwoord in om je account te activeren.</p>
          <form id="set-password-form">
            <label for="new-password">Nieuw wachtwoord</label>
            <input
              id="new-password"
              type="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
            <button class="primary" type="submit">Wachtwoord instellen</button>
            <p id="invite-status" class="status"></p>
          </form>
        </div>

        <div id="login-form" class="card" hidden>
          <p>Log in met je e-mailadres en wachtwoord.</p>
          <form id="sign-in-form">
            <label for="email">E-mail</label>
            <input id="email" type="email" autocomplete="email" required />
            <label for="password">Wachtwoord</label>
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              required
            />
            <button class="primary" type="submit">Inloggen</button>
            <p id="login-status" class="status"></p>
          </form>
          <p style="margin-top: 1rem">
            <button class="link" type="button" id="forgot-password">Wachtwoord vergeten?</button>
          </p>

          <div
            style="
              margin-top: 1.5rem;
              padding-top: 1.5rem;
              border-top: 1px solid var(--neutral-line);
            "
          >
            <p><strong>Nog geen relatie?</strong> Meld interesse aan voor de TGL-competitie.</p>
            <form id="interest-form">
              <label for="interest-name">Naam</label>
              <input id="interest-name" required />

              <label for="interest-referred-by">Doorverwezen door (optioneel)</label>
              <input id="interest-referred-by" placeholder="Naam van een bestaande relatie" />

              <label for="interest-email">E-mail</label>
              <input id="interest-email" type="email" required />

              <button class="primary" type="submit">Meld je aan</button>
              <p id="interest-status" class="status"></p>
            </form>
            <p class="fine-print">Aanvraag · geen garantie op deelname</p>
          </div>
        </div>

        <div id="signed-in" class="card" hidden>
          <p>Je bent ingelogd.</p>
          <a class="button" href="../member/index.html" style="color: white; background: var(--heym-navy)">
            Naar mijn events
          </a>
          <p style="margin-top: 1rem">
            <button class="link" id="sign-out">Uitloggen</button>
          </p>
        </div>
      </div>
    </div>

    <div id="footer-mount"></div>

    <script src="../shared/vendor/supabase-js.js"></script>
    <script src="../shared/config.js"></script>
    <script src="../shared/supabase-client.js"></script>
    <script src="../shared/footer.js"></script>
    <script>
      const PUBLISHABLE_KEY = SUPABASE_PUBLISHABLE_KEY;

      mountFooter("../");

      const inviteForm = document.getElementById("invite-form");
      const loginForm = document.getElementById("login-form");
      const signedInView = document.getElementById("signed-in");

      function show(el) {
        [inviteForm, loginForm, signedInView].forEach((e) => (e.hidden = e !== el));
      }

      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const flowType = hashParams.get("type");

      // Top-level await only works in ES modules -- this is now a plain
      // classic script (see config.js for why), so this needs an async
      // wrapper instead.
      (async () => {
        if (flowType === "invite" || flowType === "recovery") {
          show(inviteForm);
        } else {
          const { data } = await supabaseClient.auth.getSession();
          show(data.session ? signedInView : loginForm);
        }
      })();

      document
        .getElementById("set-password-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const status = document.getElementById("invite-status");
          const password = document.getElementById("new-password").value;
          status.textContent = "Bezig...";
          status.className = "status";
          const { error } = await supabaseClient.auth.updateUser({ password });
          if (error) {
            status.textContent = error.message;
            status.className = "status error";
            return;
          }
          history.replaceState(null, "", window.location.pathname);
          show(signedInView);
        });

      document
        .getElementById("sign-in-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const status = document.getElementById("login-status");
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          status.textContent = "Bezig...";
          status.className = "status";
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) {
            status.textContent = error.message;
            status.className = "status error";
            return;
          }
          show(signedInView);
        });

      document.getElementById("sign-out").addEventListener("click", async () => {
        await supabaseClient.auth.signOut();
        show(loginForm);
      });

      // Same recovery flow as the manual admin-API version used before this
      // existed -- self-service now instead of asking someone to trigger it.
      // The email lands with #type=recovery, which the flowType check above
      // already knows how to route to the set-password form.
      document.getElementById("forgot-password").addEventListener("click", async () => {
        const status = document.getElementById("login-status");
        const email = document.getElementById("email").value;
        if (!email) {
          status.textContent = "Vul eerst je e-mailadres in.";
          status.className = "status error";
          return;
        }
        status.textContent = "Bezig...";
        status.className = "status";
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + window.location.pathname,
        });
        if (error) {
          status.textContent = error.message;
          status.className = "status error";
          return;
        }
        status.textContent = "Check je e-mail voor een link om een nieuw wachtwoord in te stellen.";
        status.className = "status ok";
      });

      // submit-interest is a public endpoint (no login needed) -- plain
      // fetch with just an apikey header, same pattern as the landing
      // page's version of this form before it moved here.
      document.getElementById("interest-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const status = document.getElementById("interest-status");
        const button = e.target.querySelector("button");
        button.disabled = true;
        status.textContent = "Bezig...";
        status.className = "status";
        try {
          const res = await fetch(`${FUNCTIONS_URL}/submit-interest`, {
            method: "POST",
            headers: { apikey: PUBLISHABLE_KEY, "Content-Type": "application/json" },
            body: JSON.stringify({
              name: document.getElementById("interest-name").value,
              referred_by: document.getElementById("interest-referred-by").value || null,
              email: document.getElementById("interest-email").value,
            }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Aanmelden is niet gelukt");
          e.target.reset();
          status.textContent = "Bedankt! We nemen contact met je op.";
          status.className = "status ok";
        } catch (err) {
          status.textContent = err.message;
          status.className = "status error";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
